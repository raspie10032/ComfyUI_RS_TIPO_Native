name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-test.txt
      - name: Check release metadata
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import tomllib
          root = pathlib.Path('.')
          config = tomllib.loads((root / 'pyproject.toml').read_text())
          project = config['project']
          assignments = ast.parse((root / '__init__.py').read_text()).body
          version = next(ast.literal_eval(node.value) for node in assignments
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == '__version__'
                                 for target in node.targets))
          assert project['version'] == version, 'Registry and node versions must match'
          requirements = [line.strip() for line in (root / 'requirements.txt').read_text().splitlines()
                          if line.strip() and not line.lstrip().startswith('#')]
          assert project['dependencies'] == requirements, 'Registry dependencies must match requirements.txt'
          assert (root / project['license']['file']).is_file()
          PY
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_interface.mjs
      - run: node tests/test_sockets.mjs
      - run: node tests/test_download_status.mjs
      - run: node tests/test_report.mjs

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install comfy-cli==1.25.0
      - name: Publish validated node archive
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          COMFY_NODE_CHANGELOG: >-
            Native Gemma GGUF memory and compute improvements: CPU-resident PLE with row-only transfers,
            ComfyUI native Linear LoRA output calculation, Q4_K/Q5_K dequantization buffer reuse,
            and packed-weight reload fixes. No new runtime dependencies. In the measured Q4 setup,
            ten-character peak PyTorch allocated VRAM fell from about 3.60 to 1.78 GiB;
            PLE still uses CPU RAM. Results depend on model and hardware; see CHANGELOG and benchmark notes.
            TIPO authors, KohakuBlueleaf, Gemma and City96 contributors retain credit and their licenses.
        run: |
          test -n "$REGISTRY_ACCESS_TOKEN"
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
